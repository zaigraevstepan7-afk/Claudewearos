name: Build VoidLauncher (apktool)

# Пересобирает APK из декомпилированных исходников при каждом пуше,
# чтобы гарантировать, что проект собирается.

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build & sign APK
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidLauncher-rebuilt
          path: dist/*-debugSigned.apk
          if-no-files-found: error
